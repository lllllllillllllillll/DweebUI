<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <title>Sponsors - DweebUI.</title>
    <!-- CSS files -->
    <link href="/css/tabler.min.css?1692870487" rel="stylesheet"/>
    <link href="/css/demo.min.css?1692870487" rel="stylesheet"/>
    <link href="/css/dweebui.css" rel="stylesheet"/>
  </head>
  <body >
    <div class="page">

      <!-- EJS -->
      <%- navbar %>

      <div class="page-wrapper">

        <!-- Page body -->
        <div class="page-body">
          <div class="container-xl">
            <div class="card">
              <div class="row g-0">

                <!-- EJS -->
                <%- sidebar %>
                
                <div class="col-12 col-md-9 d-flex flex-column">
                  <div class="card-body" id="page_content">
                    <h1 class="">Sponsors</h1>
                    <label class="text-muted mb-3">Some awesome people who have donated to DweebUI.</label>
                    <div class="table-group-divider mb-3"></div>
                    <span type="button" class="btn avatar avatar-xl bg-green-lt mx-1" hx-trigger="mousedown" hx-post="/sponsors/action/thank" hx-target="#counter" name="MM"  title="MM">MM</span>
                    <span type="button" class="btn avatar avatar-xl bg-azure-lt mx-1" hx-trigger="mousedown" hx-post="/sponsors/action/thank" hx-target="#counter" name="PD" title="PD">PD</span>
                    <span type="button" class="btn avatar avatar-xl bg-teal-lt mx-1" hx-trigger="mousedown" hx-post="/sponsors/action/thank" hx-target="#counter" name="C" title="C">C</span>
                    <span type="button" class="btn avatar avatar-xl bg-indigo-lt mx-1" hx-trigger="mousedown" hx-post="/sponsors/action/thank" hx-target="#counter" name="AD" title="AD">AD</span>
                  </div>
                  <div class="row m-2 p-2">
                    <label class="text-muted mb-1 p-0">Thanks counter:</label>
                    <span type="button" class="btn avatar avatar-xl bg-yellow-lt mx-2" id="counter" hx-trigger="load" hx-get="/sponsors/view/thanks" hx-target="#counter">0</span>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
        
        <!-- EJS -->
        <%- footer %>

      </div>
    </div>

		<script src="/js/dweebui.js"></script>
		<script src="/js/htmx.min.js"></script>

    <!-- Tabler Core -->
    <script src="/js/tabler.min.js?1692870487" defer></script>
    <script src="/js/demo.min.js?1692870487" defer></script>
  </body>
</html>
